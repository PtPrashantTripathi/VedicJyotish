<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Read URL Parameter</title>
        <style>
            nav {
                align-items: center;
                display: inline-flex;
            }
            svg {
                overflow: visible !important;
            }
            @keyframes pinSpin {
                0% {
                    transform: rotate(0) translateX(0);
                }
                to {
                    transform: rotate(1turn) translateX(0);
                }
            }
            /* nav:hover */
            svg {
                animation: pinSpin 1.5s linear infinite;
                transform-origin: 20px;
            }
        </style>
    </head>
    <body>
        <nav>
            <svg>
                <polygon
                    points="100,10 40,198 190,78 10,78 160,198"
                    style="
                        fill: lime;
                        stroke: purple;
                        stroke-width: 2;
                        fill-rule: evenodd;
                    " />
            </svg>
        </nav>
        <h1>Value from URL</h1>
        <p id="output">Loading...</p>

        <script>
            // Get URL query params
            const params = new URLSearchParams(window.location.search);

            // Read "id" parameter
            const idParam = params.get("id");

            // Convert to number (if numeric), otherwise keep as string
            const value =
                idParam !== null && !isNaN(idParam) ? Number(idParam) : idParam;

            // Show it in the page
            document.getElementById("output").textContent =
                value !== null
                    ? `ID value is: ${value}`
                    : "No 'id' found in URL";
        </script>
    </body>
</html>
