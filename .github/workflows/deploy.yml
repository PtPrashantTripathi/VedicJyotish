# Workflow: Build and Deploy to GitHub Pages
name: Deploy GitHub Pages

on:
    # Trigger on push to main branch
    push:
        branches:
            - main

    # Allow manual trigger via GitHub Actions UI
    workflow_dispatch:
        inputs:
            build_env:
                description: "Build environment"
                required: false
                default: "prod"
            verbose:
                description: "Enable verbose logging"
                required: false
                default: "true"
            download_source_files:
                description: "Download source files"
                required: false
                default: "false"

# Set required permissions for GitHub Pages
permissions:
    contents: read # Read access to repository
    pages: write # Write access to GitHub Pages
    id-token: write # Required for OIDC authentication

# Prevent overlapping deployments
concurrency:
    group: pages-deployments
    cancel-in-progress: false

jobs:
    deploy:
        # Target deployment environment
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        env:
            build_env: ${{ github.event.inputs.env || 'prod' }}
            verbose: ${{ github.event.inputs.verbose || 'false' }}
            download_source_files:
                ${{ github.event.inputs.download_source_files || 'false' }}

        steps:
            # Checkout the repository
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1 # Faster checkout with shallow clone

            # Set up Node.js for building the project
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            # Setup pnpm (reads version from packageManager field in package.json)
            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            # Install Node.js project dependencies
            - name: Install dependencies
              run: pnpm install

            # Build the project
            - name: Build
              run: pnpm run build

            # Configure GitHub Pages
            - name: Setup GitHub Pages
              uses: actions/configure-pages@v5

            # Upload the build output (dist/) as an artifact for Pages
            - name: Upload Build Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./dist
                  retention-days: 5

            # Deploy the uploaded artifact to GitHub Pages
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
